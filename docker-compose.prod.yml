# docker-compose.prod.yml
# Usado por el servidor de producción.
# Las imágenes son descargadas desde GHCR (no se compila localmente).
# Uso: docker compose -f docker-compose.prod.yml pull
#      docker compose -f docker-compose.prod.yml up -d

services:
  activa-db:
    image: mysql:8.0
    container_name: activa-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - activa-db-data:/var/lib/mysql
      - ./mysqldump-backup.sh:/usr/local/bin/mysqldump-backup.sh
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  activa-backend:
    image: ghcr.io/francoseccaspina/activa-backend:latest
    container_name: activa-backend
    environment:
      NODE_ENV: production
    env_file: ./Backend/.env
    restart: always
    ports:
      - "3032:3032"
    depends_on:
      activa-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3032/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  activa-nginx:
    image: ghcr.io/francoseccaspina/activa-nginx:latest
    container_name: activa-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      activa-backend:
        condition: service_healthy
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/cert:/etc/letsencrypt
      - ./nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  activa-db-data:
