name: Build & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Definir nombres de imágenes en minúsculas
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/$OWNER/activa-backend" >> $GITHUB_ENV
          echo "NGINX_IMAGE=ghcr.io/$OWNER/activa-nginx" >> $GITHUB_ENV

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push - Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build y Push - Nginx (con Frontend compilado)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          build-args: |
            REACT_APP_FRONTEND_DOMAIN_HOST=${{ secrets.REACT_APP_FRONTEND_DOMAIN_HOST }}
            REACT_APP_BACKEND_DOMAIN_HOST=${{ secrets.REACT_APP_BACKEND_DOMAIN_HOST }}
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:latest
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy vía SSH al servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          envs: MYSQL_ROOT_PASSWORD,DATABASE_NAME,DB_USER,DATABASE_PASSWORD,SESSION_PASSWORD,JWT_SECRET,REACT_APP_FRONTEND_DOMAIN_HOST,REACT_APP_BACKEND_DOMAIN_HOST
          script: |
            # Generar .env raíz (docker-compose.prod.yml)
            cat > /root/proyectoFinal.io/.env << ENVEOF
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            DATABASE_NAME=${DATABASE_NAME}
            DATABASE_USER=${DB_USER}
            DATABASE_PASSWORD=${DATABASE_PASSWORD}
            ENVEOF

            # Generar Backend/.env
            cat > /root/proyectoFinal.io/Backend/.env << ENVEOF
            DATABASE_NAME=${DATABASE_NAME}
            DATABASE_USER_CONECT=${DB_USER}
            DATABASE_PASSWORD_CONECT=${DATABASE_PASSWORD}
            DATABASE_HOST=activa-db
            PORT=3032
            SESSION_PASSWORD=${SESSION_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            TIEMPO_CONTROL_STOCK_MINUTOS=30
            REACT_APP_FRONTEND_DOMAIN_HOST=${REACT_APP_FRONTEND_DOMAIN_HOST}
            REACT_APP_BACKEND_DOMAIN_HOST=${REACT_APP_BACKEND_DOMAIN_HOST}
            NODE_ENV=production
            ENVEOF

            cd /root/proyectoFinal.io
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "Deploy completado: $(date)"
